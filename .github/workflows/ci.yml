name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy .

      - name: Tests (deterministic, LLM mocked — no API key needed)
        run: uv run pytest

      # NOTE: evals (evals/) and any 'system' tests that hit a live LLM are intentionally NOT run
      # here — they cost money and are non-deterministic. Run them manually or on a schedule.
